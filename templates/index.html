<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트스토어 주문 정리 시스템</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #212529;
      --accent-color: #03c75a; /* 네이버 시그니처 그린 */
      --border-color: #e9ecef;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding-bottom: 60px;
    }

    .navbar-brand {
      font-weight: 700;
      color: var(--accent-color) !important;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-pills .nav-link {
      color: #495057;
      font-weight: 600;
      border-radius: 12px;
      padding: 10px 14px;
      transition: all 0.2s;
      font-size: 0.95rem;
    }

    .nav-pills .nav-link.active {
      background-color: var(--accent-color);
      color: white;
      box-shadow: 0 4px 12px rgba(3, 199, 90, 0.25);
    }

    .order-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      transition: transform 0.2s, box-shadow 0.2s;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .order-card-header {
      background: #f8f9fa;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .order-card-body {
      padding: 20px;
    }

    .formatted-text-box {
      background: #1e1e24;
      color: #7ef8a9;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      padding: 18px;
      border-radius: 12px;
      white-space: pre-wrap;
      font-size: 0.95rem;
      line-height: 1.6;
      border: 1px solid #2d2d38;
      max-height: 450px;
      overflow-y: auto;
    }

    .btn-copy {
      background-color: var(--accent-color);
      color: white;
      border: none;
      font-weight: 600;
      padding: 12px 20px;
      border-radius: 10px;
      transition: all 0.2s;
    }

    .btn-copy:hover, .btn-copy:active {
      background-color: #02b150;
      color: white;
      transform: translateY(-1px);
    }

    .toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1055;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top py-3 shadow-sm">
    <div class="container">
      <a class="navbar-brand fs-4" href="#">
        <i class="bi bi-shop"></i> 스마트스토어 주문 정리
      </a>
      <div class="d-flex align-items-center gap-2 mt-2 mt-lg-0">
        <button id="btnRefresh" class="btn btn-outline-success btn-sm rounded-pill px-3">
          <i class="bi bi-arrow-clockwise"></i> 주문 새로고침
        </button>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <!-- Header Banner -->
    <div class="row mb-3 align-items-center">
      <div class="col-md-6">
        <h3 class="fw-bold mb-1">실시간 스마트스토어 주문</h3>
        <p class="text-secondary mb-0">상태별 탭을 선택하여 정리된 주문 정보를 원클릭 복사하세요!</p>
      </div>
      <div class="col-md-6 text-md-end mt-3 mt-md-0 d-flex justify-content-md-end align-items-center gap-3">
        <div class="d-flex align-items-center gap-2">
          <label for="selectDays" class="text-secondary small fw-bold text-nowrap"><i class="bi bi-calendar3"></i> 조회기간:</label>
          <select id="selectDays" class="form-select form-select-sm" style="width: 110px;">
            <option value="2" selected>최근 2일</option>
            <option value="7">최근 7일</option>
            <option value="14">최근 14일</option>
            <option value="30">최근 30일</option>
            <option value="60">최근 60일</option>
          </select>
        </div>
        <div class="form-check form-switch d-inline-block m-0">
          <input class="form-check-input" type="checkbox" id="toggleMock">
          <label class="form-check-label fw-bold text-secondary" for="toggleMock">샘플 모드</label>
        </div>
      </div>
    </div>

    <!-- Status Tabs -->
    <ul class="nav nav-pills mb-4 bg-white p-2 rounded-4 border shadow-sm" id="statusTabs">
      <li class="nav-item flex-fill text-center">
        <button class="nav-link w-100" data-status="PAYED">
          <i class="bi bi-bell-fill me-1 text-warning"></i> 신규주문
        </button>
      </li>
      <li class="nav-item flex-fill text-center">
        <button class="nav-link active w-100" data-status="PREPARING">
          <i class="bi bi-box-seam-fill me-1 text-info"></i> 발주확인
        </button>
      </li>
      <li class="nav-item flex-fill text-center">
        <button class="nav-link w-100" data-status="DELIVERED">
          <i class="bi bi-truck me-1 text-primary"></i> 배송완료
        </button>
      </li>
      <li class="nav-item flex-fill text-center">
        <button class="nav-link w-100" data-status="PURCHASE_DECIDED">
          <i class="bi bi-check-circle-fill me-1 text-success"></i> 구매확정
        </button>
      </li>
      <li class="nav-item flex-fill text-center">
        <button class="nav-link w-100" data-status="ALL">
          <i class="bi bi-grid-fill me-1"></i> 전체보기
        </button>
      </li>
    </ul>

    <!-- Alert / Status -->
    <div id="statusAlert" class="alert alert-warning d-none fade show" role="alert">
      <i class="bi bi-exclamation-triangle-fill me-2"></i><span id="statusText"></span>
    </div>

    <!-- Order List Container -->
    <div id="orderListContainer" class="row">
      <!-- Dynamic Order Cards Will Be Inserted Here -->
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast-container">
    <div id="copyToast" class="toast align-items-center text-bg-success border-0 p-2" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body fs-6 fw-bold">
          <i class="bi bi-check-circle-fill me-2"></i> 클립보드에 주문 정보가 복사되었습니다!
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const orderListContainer = document.getElementById('orderListContainer');
    const toggleMock = document.getElementById('toggleMock');
    const selectDays = document.getElementById('selectDays');
    const btnRefresh = document.getElementById('btnRefresh');
    const statusAlert = document.getElementById('statusAlert');
    const statusText = document.getElementById('statusText');
    const statusTabs = document.getElementById('statusTabs');
    const copyToastEl = document.getElementById('copyToast');
    const copyToast = new bootstrap.Toast(copyToastEl, { delay: 2500 });

    let currentStatus = localStorage.getItem('selectedStatus') || 'PREPARING';
    let currentAbortController = null;

    // Apply saved or default tab status
    statusTabs.querySelectorAll('.nav-link').forEach(btn => {
      if (btn.getAttribute('data-status') === currentStatus) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });

    // Apply saved or default date range
    const savedDays = localStorage.getItem('selectedDays') || '2';
    if (selectDays) {
      selectDays.value = savedDays;
    }

    async function loadOrders() {
      if (currentAbortController) {
        currentAbortController.abort();
      }
      currentAbortController = new AbortController();

      statusAlert.classList.add('d-none');
      orderListContainer.innerHTML = `
        <div class="text-center py-5">
          <div class="spinner-border text-success" role="status"></div>
          <p class="mt-3 text-secondary">주문 정보를 불러오는 중입니다...</p>
        </div>`;

      const isMock = toggleMock.checked;
      const days = selectDays ? selectDays.value : 2;

      try {
        const response = await fetch(`/api/orders?mock=${isMock}&status=${currentStatus}&days=${days}&_t=${Date.now()}`, {
          signal: currentAbortController.signal,
          headers: { 'Cache-Control': 'no-cache' }
        });
        const data = await response.json();

        if (data.error) {
          statusText.innerText = data.error;
          statusAlert.classList.remove('d-none');
        }

        if (!data.success || !data.orders || data.orders.length === 0) {
          const statusNames = {
            'PAYED': '신규 결제완료',
            'PREPARING': '발주확인 (상품준비중)',
            'DELIVERED': '배송완료',
            'PURCHASE_DECIDED': '구매확정',
            'ALL': '전체'
          };
          orderListContainer.innerHTML = `
            <div class="col-12 text-center py-5">
              <i class="bi bi-inbox fs-1 text-muted"></i>
              <h5 class="mt-3 text-secondary">최근 ${days}일 내 [${statusNames[currentStatus] || currentStatus}] 조건의 주문이 없습니다.</h5>
              <p class="text-muted">조회 기간을 늘리거나 다른 탭([전체보기] 등)을 확인해 보세요.</p>
            </div>`;
          return;
        }

        renderOrders(data.orders);
      } catch (err) {
        if (err.name === 'AbortError') return;
        orderListContainer.innerHTML = `
          <div class="col-12 alert alert-danger">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> 주문 수집 중 오류가 발생했습니다: ${err.message}
          </div>`;
      }
    }

    function renderOrders(orders) {
      orderListContainer.innerHTML = '';
      orders.forEach((order, index) => {
        const col = document.createElement('div');
        col.className = 'col-lg-6';

        col.innerHTML = `
          <div class="order-card">
            <div class="order-card-header">
              <span class="badge bg-success-subtle text-success fs-6 fw-bold">주문 #${index + 1}</span>
              <span class="text-secondary small"><i class="bi bi-clock"></i> ${new Date().toLocaleTimeString()}</span>
            </div>
            <div class="order-card-body">
              <pre class="formatted-text-box mb-3" id="text-box-${index}">${escapeHtml(order.formattedText)}</pre>
              <div class="d-grid gap-2">
                <button class="btn btn-copy" onclick="copyToClipboard('${index}')">
                  <i class="bi bi-clipboard-check me-2"></i> 주문 정보 텍스트 복사하기
                </button>
              </div>
            </div>
          </div>
        `;
        orderListContainer.appendChild(col);
      });
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function copyToClipboard(index) {
      const textBox = document.getElementById(`text-box-${index}`);
      const text = textBox.innerText;

      navigator.clipboard.writeText(text).then(() => {
        copyToast.show();
      }).catch(err => {
        alert('복사 실패: ' + err);
      });
    }

    // Tab switching event
    statusTabs.addEventListener('click', (e) => {
      const targetBtn = e.target.closest('button');
      if (!targetBtn) return;

      statusTabs.querySelectorAll('.nav-link').forEach(btn => btn.classList.remove('active'));
      targetBtn.classList.add('active');

      currentStatus = targetBtn.getAttribute('data-status');
      localStorage.setItem('selectedStatus', currentStatus);
      loadOrders();
    });

    toggleMock.addEventListener('change', loadOrders);
    if (selectDays) {
      selectDays.addEventListener('change', () => {
        localStorage.setItem('selectedDays', selectDays.value);
        loadOrders();
      });
    }
    btnRefresh.addEventListener('click', loadOrders);

    // Initial load immediately
    loadOrders();
  </script>
</body>
</html>
